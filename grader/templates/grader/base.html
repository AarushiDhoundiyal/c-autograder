<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AutoGrader{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>pre.case{background:#f6f8fa;border:1px solid #ddd;padding:.6rem;border-radius:.4rem;white-space:pre-wrap}</style>
</head><body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4"><div class="container">
  <a class="navbar-brand" href="{% url 'problems' %}">AutoGrader</a>
  <div class="navbar-nav me-auto"><a class="nav-link" href="{% url 'problems' %}">Problems</a>
    {% if user.is_authenticated %}<a class="nav-link" href="{% url 'history' %}">My submissions</a>{% endif %}
    {% if user.is_staff %}<a class="nav-link" href="/admin/">Admin</a>{% endif %}</div>
  {% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}" class="d-flex align-items-center">{% csrf_token %}
    <span class="navbar-text me-3">{{ user.username }}</span><button class="btn btn-sm btn-outline-light">Sign out</button></form>{% endif %}
</div></nav>
<div class="container pb-5">
{% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</div></body></html>
